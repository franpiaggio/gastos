<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos</title>
  <meta name="description" content="Gastos diarios, suscripciones y vencimientos.">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-summary" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 21h14"/></symbol>
      <symbol id="i-comida" viewBox="0 0 24 24"><path d="M5 3v6a3 3 0 0 0 6 0V3M8 3v18"/><path d="M19 21V3c-2.5 0-4 2.5-4 6v4h4"/></symbol>
      <symbol id="i-super" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/></symbol>
      <symbol id="i-transporte" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 18v3M16 18v3M8 14.5h.01M16 14.5h.01"/></symbol>
      <symbol id="i-salidas" viewBox="0 0 24 24"><path d="M7.5 3h9l-.6 6.2a3.9 3.9 0 0 1-7.8 0z"/><path d="M12 13v8M8 21h8"/></symbol>
      <symbol id="i-casa" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-salud" viewBox="0 0 24 24"><path d="M19.5 12.6 12 20l-7.5-7.4A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 7.5 6.6z"/></symbol>
      <symbol id="i-ropa" viewBox="0 0 24 24"><path d="M9 3 3.5 6l2 5 2.5-1v11h8V10l2.5 1 2-5L15 3a3 3 0 0 1-6 0z"/></symbol>
      <symbol id="i-tech" viewBox="0 0 24 24"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></symbol>
      <symbol id="i-otros" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></symbol>
    </defs>
  </svg>

  <header class="top">
    <button class="title-btn" id="title" data-action="today" aria-live="polite">Gastos</button>
    <div class="top-actions">
      <span class="month-nav" id="monthNav">
        <button class="icon-btn" data-action="prev-month" aria-label="Mes anterior"><svg class="i"><use href="#i-left"/></svg></button>
        <button class="icon-btn" data-action="next-month" aria-label="Mes siguiente"><svg class="i"><use href="#i-right"/></svg></button>
      </span>
      <button class="icon-btn" data-action="settings" aria-label="Ajustes"><svg class="i"><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <main id="view"></main>

  <button class="fab" data-action="add" aria-label="Nuevo gasto"><svg class="i"><use href="#i-plus"/></svg></button>

  <nav class="tabs" aria-label="Secciones">
    <button data-tab="home" aria-current="page"><svg class="i"><use href="#i-summary"/></svg>Resumen</button>
    <button data-tab="gastos"><svg class="i"><use href="#i-list"/></svg>Gastos</button>
    <button data-tab="subs"><svg class="i"><use href="#i-repeat"/></svg>Suscripciones</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="sheet" aria-labelledby="sheetTitle"><form method="dialog" id="sheetForm" autocomplete="off" novalidate></form></dialog>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
